[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.38"
optimizer = true
optimizer_runs = 2000
evm_version = "prague"
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
